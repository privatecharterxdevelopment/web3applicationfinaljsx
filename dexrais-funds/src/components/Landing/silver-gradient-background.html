<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silbriger Gradient Hintergrund</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #gradient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }


    </style>
</head>
<body>
    <canvas id="gradient-canvas"></canvas>

    <script>
        const canvas = document.getElementById('gradient-canvas');
        const ctx = canvas.getContext('2d');

        // Canvas Größe anpassen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Animation Parameter
        let time = 0;
        const speed = 0.0015;

        // Silber Farbpalette - hell mit Kontrast aber nicht zu dunkel
        const silverColors = [
            { r: 160, g: 165, b: 170 },  // Mittel-Silber (hellster dunkler Ton)
            { r: 190, g: 195, b: 200 },  // Hell-Silber
            { r: 220, g: 225, b: 230 },  // Sehr hell
            { r: 240, g: 243, b: 246 },  // Fast Weiß
            { r: 255, g: 255, b: 255 },  // Weiß
            { r: 255, g: 255, b: 255 },  // Weiß
            { r: 245, g: 248, b: 250 },  // Fast Weiß
            { r: 210, g: 215, b: 220 },  // Hell
            { r: 180, g: 185, b: 190 },  // Mittel-Hell
        ];

        function getColorAtTime(t, offset) {
            const wave = Math.sin(t + offset) * 0.5 + 0.5;
            const index = wave * (silverColors.length - 1);
            const i1 = Math.floor(index);
            const i2 = Math.min(i1 + 1, silverColors.length - 1);
            const factor = index - i1;
            
            const c1 = silverColors[i1];
            const c2 = silverColors[i2];
            
            return {
                r: c1.r + (c2.r - c1.r) * factor,
                g: c1.g + (c2.g - c1.g) * factor,
                b: c1.b + (c2.b - c1.b) * factor
            };
        }

        function animate() {
            time += speed;

            // Mehrere bewegliche Gradienten - mit stärkerem Kontrast
            const numGradients = 6;
            
            for (let g = 0; g < numGradients; g++) {
                const angle = time * (1.2 + g * 0.4) + (g * Math.PI / 3);
                const radius = Math.min(canvas.width, canvas.height) * 1.5;
                
                const x1 = canvas.width / 2 + Math.cos(angle) * radius;
                const y1 = canvas.height / 2 + Math.sin(angle) * radius;
                const x2 = canvas.width / 2 - Math.cos(angle) * radius;
                const y2 = canvas.height / 2 - Math.sin(angle) * radius;
                
                const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
                
                // Ultra-smooth Übergänge mit mehr Kontrast-Betonung
                const numStops = 30;
                for (let i = 0; i <= numStops; i++) {
                    const stop = i / numStops;
                    // Erhöhter Kontrast durch stärkere Wellenbewegung
                    const color = getColorAtTime(time * 3, stop * Math.PI * 3 + g * 1.5);
                    const alpha = 0.3 + (Math.sin(time * 4 + g) * 0.2);
                    gradient.addColorStop(stop, `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`);
                }
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Radiale Wellen mit dramatischem Hell-Dunkel-Kontrast
            for (let i = 0; i < 5; i++) {
                const offsetX = Math.sin(time * (1.5 + i * 0.5)) * canvas.width * 0.35;
                const offsetY = Math.cos(time * (1.8 + i * 0.4)) * canvas.height * 0.35;
                
                const radial = ctx.createRadialGradient(
                    canvas.width / 2 + offsetX,
                    canvas.height / 2 + offsetY,
                    0,
                    canvas.width / 2 + offsetX,
                    canvas.height / 2 + offsetY,
                    Math.max(canvas.width, canvas.height) * (0.4 + i * 0.25)
                );
                
                // Stärkerer Kontrast zwischen Zentrum und Rand
                const centerColor = getColorAtTime(time * 2.5, i * Math.PI * 0.8);
                const edgeColor = getColorAtTime(time * 2.5 + Math.PI * 1.5, i * Math.PI * 0.8);
                
                radial.addColorStop(0, `rgba(${centerColor.r}, ${centerColor.g}, ${centerColor.b}, 0.4)`);
                radial.addColorStop(0.3, `rgba(${centerColor.r}, ${centerColor.g}, ${centerColor.b}, 0.2)`);
                radial.addColorStop(1, `rgba(${edgeColor.r}, ${edgeColor.g}, ${edgeColor.b}, 0.3)`);
                
                ctx.fillStyle = radial;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Pulsierende Spots mit extremem Hell-Dunkel-Wechsel
            for (let i = 0; i < 4; i++) {
                const pulse = (Math.sin(time * 3.5 + i * Math.PI * 0.5) + 1) / 2;
                const x = canvas.width * (0.15 + i * 0.25);
                const y = canvas.height * (0.3 + Math.sin(time * 1.2 + i) * 0.4);
                
                const spot = ctx.createRadialGradient(x, y, 0, x, y, 250 + pulse * 200);
                
                // Extreme Kontraste - entweder sehr hell oder sehr dunkel
                const spotColor = getColorAtTime(time * 2.8, i * Math.PI * 1.3);
                spot.addColorStop(0, `rgba(${spotColor.r}, ${spotColor.g}, ${spotColor.b}, ${0.5 * pulse})`);
                spot.addColorStop(0.5, `rgba(${spotColor.r}, ${spotColor.g}, ${spotColor.b}, ${0.2 * pulse})`);
                spot.addColorStop(1, `rgba(${spotColor.r}, ${spotColor.g}, ${spotColor.b}, 0)`);
                
                ctx.fillStyle = spot;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
